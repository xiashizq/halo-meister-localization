# One-click framework-dependent win-x64 package.
# End users install the .NET Desktop Runtime and Windows App Runtime separately.
# GitHub → Actions → "Release" → Run workflow → Download artifact.
name: Release

run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also create GitHub Release vX.Y.Z (from Directory.Build.props)"
        type: boolean
        default: false
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build framework-dependent win-x64 ZIP
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath .\Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Directory.Build.props contains an invalid SemVer: $version"
          }
          if ("${{ github.event_name }}" -eq "push" -and
              "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match canonical version v$version. Update Directory.Build.props first."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Canonical version: $version"

      - name: Publish framework-dependent package
        shell: pwsh
        run: .\publish-release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Verify framework-dependent package
        shell: pwsh
        run: |
          $package = "artifacts/release/HaloMeister-${{ steps.version.outputs.value }}-win-x64"
          $required = @(
            "$package\HaloMeister.exe",
            "$package\HaloMeister.dll",
            "$package\START_HERE.txt"
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Published package is missing: $path"
            }
          }
          if (Test-Path -LiteralPath "$package\hostfxr.dll") {
            throw "Package unexpectedly includes the self-contained .NET host runtime."
          }
          if (!(Select-String -LiteralPath "$package\START_HERE.txt" `
              -Pattern "Windows App Runtime" -Quiet)) {
            throw "Package instructions do not mention the Windows App Runtime prerequisite."
          }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloMeister-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/release/HaloMeister-${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/release/HaloMeister-${{ steps.version.outputs.value }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create / update GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          inputs.create_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "artifacts/release/HaloMeister-$version-win-x64.zip"
          $sha = "$zip.sha256"
          $prerelease = "${{ inputs.prerelease }}" -eq "true"
          $title = "Halo Meister $version"
          $isTagPush = "${{ github.event_name }}" -eq "push"

          $notesPath = Join-Path ".github" "release-notes" "$version.md"
          if (!(Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release notes file: $notesPath"
          }
          $notes = Get-Content -LiteralPath $notesPath -Raw -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "Release notes file is empty: $notesPath"
          }

          $existing = $null
          try { $existing = gh release view $tag 2>$null } catch { $existing = $null }

          if ($existing) {
            Write-Host "Updating existing release $tag"
            gh release upload $tag $zip $sha --clobber
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
            Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
            if ($prerelease) {
              gh release edit $tag --prerelease --title $title --notes-file $notesFile
            } else {
              gh release edit $tag --latest --title $title --notes-file $notesFile
            }
            return
          }

          Write-Host "Creating release $tag"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          $ghArgs = @(
            "release", "create", $tag, $zip, $sha,
            "--title", $title,
            "--notes-file", $notesFile
          )
          if ($prerelease) { $ghArgs += "--prerelease" }
          if (-not $isTagPush) {
            $ghArgs += @("--target", "${{ github.sha }}")
          }
          & gh @ghArgs
